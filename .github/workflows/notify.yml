
name: Deployment Notification

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Report successful deployment
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        run: echo "Deployment successful! Site URL is https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Send success notification to Slack
        if: ${{ github.event.workflow_run.conclusion == 'success' && env.SLACK_WEBHOOK_URL != '' }}
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: curl --fail --silent --show-error -X POST -H 'Content-type: application/json' --data "{\"text\":\"Portfolio deployed: ${SITE_URL}\"}" "$SLACK_WEBHOOK_URL"

      - name: Report failed deployment
        if: ${{ github.event.workflow_run.conclusion == 'failure' }}
        run: echo "Deployment FAILED! Check the Actions tab."

      - name: Send failure notification to Slack
        if: ${{ github.event.workflow_run.conclusion == 'failure' && env.SLACK_WEBHOOK_URL != '' }}
        run: curl --fail --silent --show-error -X POST -H 'Content-type: application/json' --data '{"text":"Portfolio deployment failed. Check the GitHub Actions tab."}' "$SLACK_WEBHOOK_URL"
